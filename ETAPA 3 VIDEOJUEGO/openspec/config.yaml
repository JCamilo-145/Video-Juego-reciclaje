# SDD configuration for "Fase 3 - Proyecto Web" (UNAD, Semester 4).
# Generated by sdd-init on 2026-10-23. Bootstrap only; no change was created.
# Artifact language: English, neutral professional register (per AGENTS.md).

schema: spec-driven

context: |
  Tech stack: Unity 6 (6000.6.6f1), C# under Assets/, URP 17.6.0, WebGL (browser) build target;
  packages: Input System 1.20.0, Cinemachine 6.6.0, uGUI 2.6.0.
  Architecture: student course project; tutorial and Starter Assets template content only, no project game scripts yet.
  Testing: no runnable test framework; com.unity.test-framework absent from Packages/manifest.json; adding
  com.unity.test-framework 1.4.x enables EditMode/PlayMode NUnit tests (recipe: skills/unity-testing/SKILL.md).
  Strict TDD: false.
  Style: English artifacts; .meta committed with assets in the same commit; asset CRUD only in the Unity Editor;
  Library/, Temp/, Logs/, UserSettings/, Obj/, Builds/ never committed; .config/kilo/ stays tracked.

strict_tdd: false

persistence:
  artifact_store: "both (openspec files + engram memory, hybrid)"
  engram_project: "fase 3 - proyecto web"
  execution_mode: auto
  delivery_strategy: ask-on-risk
  review_budget_lines: 400

testing:
  runner:
    available: false
    command: ""
    framework: "none; com.unity.test-framework absent from Packages/manifest.json"
    setup_recipe: "skills/unity-testing/SKILL.md: add com.unity.test-framework 1.4.x, then editor-only test asmdefs"
  layers:
    unit:
      available: false
      tool: "EditMode NUnit (blocked on Unity Test Framework install)"
    integration:
      available: false
      tool: "PlayMode NUnit (blocked on Unity Test Framework install)"
    e2e:
      available: false
      tool: "WebGL manual browser testing; no automation installed"
  coverage:
    available: false
    command: ""
    note: "com.unity.testtools.codecoverage not installed"
  quality:
    linter:
      available: false
      command: ""
    type_checker:
      available: false
      command: ""
      note: "IDE compile only (Rider 3.0.40 / Visual Studio 2.0.28 packages); no standalone CLI"
    formatter:
      available: false
      command: ""

rules:
  proposal:
    - Include rollback plan for risky changes
    - Surface WebGL platform constraints when a change touches runtime behavior
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Respect Unity asset integrity: no asset create/move/rename/delete outside the Unity Editor
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow skills/unity-scripting/SKILL.md conventions ([SerializeField], component caching, events, coroutines, asmdef)
      - Commit .meta files together with their assets in the same commit
      - Do not create, move, rename, or delete assets outside the Unity Editor
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
